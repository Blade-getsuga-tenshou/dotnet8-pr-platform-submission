name: PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/dotnet-build-test.yml
    with:
      solution: DotNet8PrPlatform.sln
      configuration: Release

  python-tests:
    name: Python tests (pytest)
    if: github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v

  build-x86:
    name: x86 build and test (legacy target)
    if: github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET 8 SDK (x86)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
          architecture: x86

      - name: Restore
        run: dotnet restore DotNet8PrPlatform.sln -p:PlatformTarget=x86

      - name: Build (x86)
        run: dotnet build DotNet8PrPlatform.sln -c Release --no-restore -p:PlatformTarget=x86

      - name: Test (x86)
        run: dotnet test DotNet8PrPlatform.sln -c Release --no-build -p:PlatformTarget=x86