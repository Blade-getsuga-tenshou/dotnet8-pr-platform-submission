name: Reusable .NET build and test

on:
  workflow_call:
    inputs:
      solution:
        type: string
        default: DotNet8PrPlatform.sln
      configuration:
        type: string
        default: Release
      dotnet-version:
        type: string
        default: '8.0.x'

permissions:
  contents: read

jobs:
  build-test:
    name: Build, test, and collect coverage
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore
        run: dotnet restore "${{ inputs.solution }}"

      - name: Build
        run: dotnet build "${{ inputs.solution }}" --configuration "${{ inputs.configuration }}" --no-restore

      - name: Test with coverage
        run: dotnet test "${{ inputs.solution }}" --configuration "${{ inputs.configuration }}" --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Publish build output
        run: dotnet publish src/Core/Core.csproj --configuration "${{ inputs.configuration }}" --no-build --output ./artifacts/Core

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: TestResults/**
          retention-days: 14

      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-output
          path: artifacts/Core/**
          retention-days: 14